services:
  bot-wpp:
    build: .
    image: bot-wpp:latest
    container_name: bot-wpp
    restart: unless-stopped
    mem_limit: 800m
    memswap_limit: 800m
    env_file:
      - .env
    volumes:
      - ./data:/app/data       # base de datos SQLite (incluye la sesión de WhatsApp/Baileys)
      - ./audios:/app/audios   # audios curados + los que se agregan con /guardar
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
